<!DOCTYPE html>
<html>
<head>
<title>Mirsulton Portfolio</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:linear-gradient(135deg,#020617,#0b3b66);
    color:white;
    min-height:100vh;
    text-align:center;
}

.container{
    padding:100px 20px;
    animation:show 2s ease;
}

h1{
    font-size:45px;
    color:#00bfff;
}

h2{
    margin:20px;
    color:#8ddcff;
}

p{
    max-width:700px;
    margin:20px auto;
    font-size:20px;
    color:#ddd;
}

.buttons a{
    display:inline-block;
    margin:15px;
    padding:12px 30px;
    color:white;
    text-decoration:none;
    border:2px solid #00bfff;
    border-radius:30px;
    transition:0.4s;
}

.buttons a:hover{
    background:#00bfff;
    color:black;
}

section{
    padding:40px;
    animation:show 3s ease;
}

@keyframes show{
    from{
        opacity:0;
        transform:translateY(50px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}
</style>

</head>

<div class="container">

<h1>Mirsulton Mirsharifhonov</h1>

</p>

</div>

</html>
