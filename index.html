<!DOCTYPE html>
<html>
<head>
<title>UZBRAYZEN Gaming</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    color:white;
    background:
    radial-gradient(circle at top,#003b70,#000814 45%,#000);
    overflow-x:hidden;
}


/* yulduzlar */
body::before{
    content:"";
    position:fixed;
    width:200%;
    height:200%;
    background-image:
    radial-gradient(white 1px,transparent 2px);
    background-size:80px 80px;
    animation:stars 25s linear infinite;
    opacity:.35;
    z-index:-1;
}

@keyframes stars{
    from{
        transform:translate(0,0);
    }
    to{
        transform:translate(-200px,200px);
    }
}


header{
    text-align:center;
    padding:80px 20px;
}


.logo{
    font-size:60px;
    color:#00bfff;
    text-shadow:
    0 0 10px #00bfff,
    0 0 30px #0066ff;
}


.subtitle{
    margin-top:15px;
    color:#b9eaff;
    font-size:22px;
}



.games{
    display:flex;
    justify-content:center;
    gap:40px;
    flex-wrap:wrap;
    padding:40px;
}


.card{
    width:330px;
    min-height:260px;
    background:rgba(0,10,30,.8);
    border:2px solid #0077ff;
    border-radius:25px;
    padding:35px;
    text-align:center;
    transition:.4s;
    cursor:pointer;
}


.card:hover{
    transform:scale(1.12);
    box-shadow:
    0 0 25px #00bfff,
    0 0 50px #0066ff;
}



.card h1{
    font-size:45px;
    color:#00ffff;
    margin-bottom:20px;
}


.card p{
    font-size:18px;
    line-height:35px;
    color:#ddd;
}


a{
    text-decoration:none;
    color:white;
}



.instagram{
    display:block;
    width:260px;
    margin:40px auto;
    padding:15px;
    background:#0066ff;
    border-radius:30px;
    text-align:center;
    transition:.3s;
}


.instagram:hover{
    background:#00bfff;
    color:black;
}



/* pastga/o'ngga strelka */

.arrow{
    position:fixed;
    right:30px;
    bottom:30px;
    width:55px;
    height:55px;
    border-radius:50%;
    background:#0077ff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
    box-shadow:0 0 20px #00bfff;
}


.arrow:hover{
    transform:scale(1.15);
}

</style>

</head>


<body>


<header>

<div class="logo">
UZBRAYZEN

<div class="subtitle">
🎮 Gaming Universe
</div>

</header>



<div class="games">

<h1>FREE FIRE</h1>

<p>
🔥 Battle Royale Player<br>
🆔 ID: 7357211531<br>
🏆 Booyah Fighter<br>
📸 @uzbrayzen2010
</p>

</div>

</a>



<a href="https://instagram.com/uzbrayzen2010" target="_blank">

<p>

👑 Ultimate Team<br>

</div>
