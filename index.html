html{
    scroll-behavior:smooth;
}


body{

    min-height:100vh;

    color:white;

    background:
    radial-gradient(circle at top,#004080,#000814 50%,#000);

    overflow-x:hidden;

}


/* kosmik yulduzlar */

body::before{

    content:"";

    position:fixed;

    width:200%;

    height:200%;

    background-image:
    radial-gradient(white 1px,transparent 2px);

    background-size:70px 70px;

    animation:stars 20s linear infinite;

    opacity:.4;

    z-index:-1;

}


@keyframes stars{

from{
    transform:translate(0,0);
}

to{
    transform:translate(-300px,300px);
}

}



header{

    text-align:center;

    padding:80px 20px;

    color:#bdefff;

}



.games{

    display:flex;

    justify-content:center;

    gap:40px;

    flex-wrap:wrap;

    padding:50px;

}



.card{

    width:350px;

    padding:40px;

    text-align:center;

    background:rgba(0,10,30,.8);

    border:2px solid #0077ff;

    border-radius:25px;

    transition:.4s;

}



.card:hover{

    transform:scale(1.1);

    box-shadow:
    0 0 30px #00ffff;

}



.card h1{

    font-size:45px;

    color:#00ffff;

}



.card p{

    margin-top:20px;

    line-height:35px;

    font-size:20px;

}



a{

    text-decoration:none;

    color:white;

}



.instagram{

    display:block;

    width:270px;

    margin:30px auto;

    padding:15px;

    background:#0077ff;

    border-radius:30px;

    text-align:center;

}



.arrow{

    position:fixed;

    right:30px;

    bottom:30px;

    width:55px;

    height:55px;

    border-radius:50%;

    background:#0077ff;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:30px;

}
