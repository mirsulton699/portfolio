<!DOCTYPE html>
<html>
<head>
<title>UzRayzen Gaming</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    min-height:100vh;
    background:#000;
    color:white;
    overflow-x:hidden;
}

/* Kosmik fon */
.stars{
    position:fixed;
    width:100%;
    height:100%;
    background:
    radial-gradient(circle, white 1px, transparent 2px);
    background-size:60px 60px;
    animation:moveStars 20s linear infinite;
    opacity:0.5;
}

@keyframes moveStars{
    from{
        background-position:0 0;
    }
    to{
        background-position:500px 500px;
    }
}


.container{
    position:relative;
    text-align:center;
    padding:80px 20px;
}


h1{
    font-size:50px;
    color:#00bfff;
    text-shadow:0 0 20px #00bfff;
}


h2{
    margin:15px;
    color:#aaa;
}


.games{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:30px;
    margin-top:50px;
}


.card{
    width:280px;
    padding:30px;
    background:#07111f;
    border:2px solid #0066ff;
    border-radius:20px;
    transition:0.4s;
    cursor:pointer;
}


.card:hover{
    transform:scale(1.1);
    box-shadow:0 0 30px #00bfff;
    border-color:#00ffff;
}


.card h3{
    color:#00ffff;
    font-size:30px;
}


.card p{
    margin:15px;
    color:#ddd;
}


.button{
    display:inline-block;
    margin-top:30px;
    padding:12px 30px;
    border-radius:30px;
    background:#008cff;
    color:white;
    text-decoration:none;
    transition:0.3s;
}


.button:hover{
    background:white;
    color:black;
}

</style>

</head>

<body>

<div class="stars"></div>


<div class="container">
