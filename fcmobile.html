<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FC Mobile | Mr.Mirsulton</title>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}


body{

min-height:100vh;

background:
radial-gradient(circle at top,#0055ff,#02030a 60%);

color:white;

display:flex;

justify-content:center;

align-items:center;

}



.box{

width:90%;

max-width:600px;

padding:50px;

background:rgba(0,0,0,.75);

border:2px solid #00aaff;

border-radius:30px;

text-align:center;

box-shadow:
0 0 40px #0088ff;

animation:show 1s;

}



h1{

font-size:60px;

color:#00aaff;

text-shadow:
0 0 20px #00aaff;

}



p{

font-size:22px;

line-height:40px;

margin-top:25px;

}



a{

display:inline-block;

margin-top:30px;

padding:15px 35px;

background:#0077ff;

color:white;

text-decoration:none;

border-radius:30px;

transition:.3s;

}



a:hover{

background:#00ffff;

color:black;

transform:scale(1.1);

}



@keyframes show{

from{

opacity:0;

transform:translateY(50px);

}

to{

opacity:1;

}

}


</style>

</head>



<body>
